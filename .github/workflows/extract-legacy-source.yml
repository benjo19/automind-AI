name: Extract archived original for comparison
on:
  push:
    paths:
      - .github/workflows/extract-legacy-source.yml
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/redesign/modern-orderly-2026'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Extract original into reference directory
        run: |
          mkdir -p legacy-reference
          unzip -q -o automind-pro.zip -d legacy-reference
          test -f legacy-reference/automind-pro/src/App.jsx
          test -f legacy-reference/automind-pro/src/index.css
      - name: Commit reference source without changing production files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add legacy-reference
          if ! git diff --cached --quiet; then
            git commit -m "Extract archived original source for redesign comparison"
            git push
          fi
